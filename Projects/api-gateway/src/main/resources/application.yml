server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: account-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountServiceBreaker
                fallbackUri: forward:/fallback/accounts

        - id: transfer-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: CircuitBreaker
              args:
                name: transferServiceBreaker
                fallbackUri: forward:/fallback/transfers

resilience4j:
  timelimiter:
    instances:
      accountServiceBreaker:
        timeout-duration: 5s
      transferServiceBreaker:
        timeout-duration: 5s
  circuitbreaker:
    instances:
      accountServiceBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
      transferServiceBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
